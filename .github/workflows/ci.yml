name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    services:
      redis:
        image: redis:8.0.6-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rawan_test
          POSTGRES_PASSWORD: ci_test_only_password
          POSTGRES_DB: rawan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rawan_test -d rawan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v6
      - name: Set up Node and pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Generate offline OpenAPI contract
        run: node apps/api/dist/contracts/openapi.cli.js
      - name: Backend and worker unit tests
        run: pnpm test
      - name: API HTTP tests
        run: pnpm --filter @rawan/api exec vitest run --config vitest.config.e2e.ts
      - name: All isolated PostgreSQL domain and media regressions
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://rawan_test:ci_test_only_password@127.0.0.1:5432/rawan_test
          HTTP_RATE_LIMIT_ENABLED: "false"
        run: node apps/api/test/database-regression.mjs
      - name: Audit installed dependency advisories
        run: pnpm audit --audit-level=high
      - name: Queue worker Redis/PostgreSQL integration
        env:
          NODE_ENV: test
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          TEST_DATABASE_URL: postgresql://rawan_test:ci_test_only_password@127.0.0.1:5432/rawan_test
        run: pnpm --filter @rawan/api test:jobs:integration
      - name: AI isolated Redis/PostgreSQL HTTP integration (fake only)
        env:
          NODE_ENV: test
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          TEST_DATABASE_URL: postgresql://rawan_test:ci_test_only_password@127.0.0.1:5432/rawan_test
        run: pnpm --filter @rawan/api test:ai:integration
